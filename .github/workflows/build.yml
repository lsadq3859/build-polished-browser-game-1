name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install --save-exact --no-audit --no-fund \
            @capacitor/core@8.1.2 \
            @capacitor/cli@8.1.2 \
            @capacitor/android@8.1.2
          npx cap init "تكسير النيون" "com.lsadq3859.neonbreaker" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set Android app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/res/values/strings.xml')
          s = p.read_text()
          s = s.replace('build-polished-browser-game (1)', 'تكسير النيون')
          s = s.replace('تكسير النيون', 'تكسير النيون')
          p.write_text(s)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/takseer-alneon-debug.apk
          sha256sum out/takseer-alneon-debug.apk > out/takseer-alneon-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: takseer-alneon-debug-apk
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: تكسير النيون - الإصدار ${{ github.run_number }}
          files: out/takseer-alneon-debug.apk
          fail_on_unmatched_files: true
